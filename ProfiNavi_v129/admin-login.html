<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProfiNavi — Admin</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="admin-login-page"><main class="admin-login-card"><a class="admin-back" href="client.html">‹</a><div class="admin-brand">Profi<span>Navi</span> <small>ADMIN</small></div>
<section id="phonePane"><h1>Вход администратора</h1><p>Введите номер телефона администратора. Доступ выдаётся только серверному allowlist.</p><label>Номер телефона</label><div class="admin-phonebox"><span>🇰🇬 +996</span><input id="adminPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="555 55 55 55" maxlength="12"></div><button id="adminSend" class="admin-primary">Получить код</button></section>
<section id="codePane" class="hidden"><h1>Подтвердите номер</h1><p id="adminCodeText">Введите код из SMS.</p><div id="adminDemo" class="admin-demo hidden">Тестовый режим: код 111111</div><input id="adminCode" class="admin-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="adminVerify" class="admin-primary">Войти</button><button id="adminBackPhone" class="admin-link">Изменить номер</button></section>
<div id="adminError" class="admin-error hidden"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const $=id=>document.getElementById(id);let pendingPhone='';
function digitsLocal(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('996'))d=d.slice(3);if(d.startsWith('0'))d=d.slice(1);return d.slice(0,9)}
function fullPhone(v){const d=digitsLocal(v);return d.length===9?'+996'+d:''}
function formatLocal(v){const d=digitsLocal(v),a=d.slice(0,3),b=d.slice(3,5),c=d.slice(5,7),e=d.slice(7,9);return[a,b,c,e].filter(Boolean).join(' ')}
$('adminPhone').addEventListener('input',()=>{$('adminPhone').value=formatLocal($('adminPhone').value)});
function pane(code){$('phonePane').classList.toggle('hidden',code);$('codePane').classList.toggle('hidden',!code);$('adminError').classList.add('hidden')}
function fail(msg){$('adminError').textContent=msg;$('adminError').classList.remove('hidden')}
$('adminBackPhone').onclick=()=>pane(false);
$('adminSend').onclick=async()=>{const phone=fullPhone($('adminPhone').value);if(!phone)return fail('Введите полный номер телефона.');const b=$('adminSend');b.disabled=true;b.textContent='Запрашиваем…';try{const {error}=await PNAuth.sendOtp('phone',phone,{shouldCreateUser:false,purpose:'admin-login'});if(error)throw error;pendingPhone=phone;$('adminDemo').classList.toggle('hidden',window.PN_TEST_MODE!==true);$('adminCodeText').textContent=window.PN_TEST_MODE?'Введите демо-код подтверждения.':'Введите 6-значный код из SMS.';pane(true);setTimeout(()=>$('adminCode').focus(),50)}catch(e){fail('Не удалось запросить код: '+e.message)}finally{b.disabled=false;b.textContent='Получить код'}};
$('adminVerify').onclick=async()=>{const code=$('adminCode').value.trim(),b=$('adminVerify');if(!/^\d{6}$/.test(code))return fail('Введите 6 цифр.');b.disabled=true;b.textContent='Проверяем…';try{const {error}=await PNAuth.verifyOtp('phone',pendingPhone,code,{shouldCreateUser:false,purpose:'admin-login'});if(error)throw error;await PNAdmin.ensureRole();location.replace('admin.html')}catch(e){try{await window.PNAuth?.signOut?.()}catch(_){try{await pnSupabase.auth.signOut({scope:'local'})}catch(__){}}fail('Доступ не разрешён: '+e.message);b.disabled=false;b.textContent='Войти'}};
window.addEventListener('DOMContentLoaded',async()=>{try{const u=await PNAuth.currentUser();if(u){await PNAdmin.ensureRole();location.replace('admin.html')}}catch(e){}});
</script></body></html>

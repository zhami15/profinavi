<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProfiNavi Admin — мастер</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="admin-page"><main class="admin-shell admin-editor-shell"><header class="admin-top"><div><a class="admin-back-link" href="admin.html">← Все мастера</a><h1 id="editorTitle">Мастер</h1><p id="editorMeta">Загрузка…</p></div><button id="adminLogout" class="admin-logout-btn">Выйти</button></header>
<nav class="admin-tabs"><button class="active" data-tab="profile">Профиль</button><button data-tab="services">Услуги</button><button data-tab="works">Работы</button><button data-tab="schedule">Расписание</button><button data-tab="audit">История</button></nav>
<section id="adminEditor"><div class="admin-loading">Загружаем данные…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const params=new URLSearchParams(location.search),legacyId=Number(params.get('id'));let bundle=null,currentTab='profile';const host=document.getElementById('adminEditor');
const categories=[['hair','Волосы'],['nails','Ногти'],['lashes','Ресницы'],['brows','Брови'],['makeup','Макияж']];
function E(v){return PNAdmin.esc(v)}function money(v){return v===null||v===undefined?'':Number(v)}
function tab(name){currentTab=name;document.querySelectorAll('.admin-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render()}
document.querySelectorAll('.admin-tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.getElementById('adminLogout').onclick=()=>PNAdmin.logout();
function profileView(){const p=bundle.profile,c=bundle.contact||{},cats=p.categories||[];return`<section class="admin-panel"><div class="admin-panel-head"><div><h2>Основной профиль</h2><p>${E(c.phone||'Телефон не указан')} · UUID ${E(p.user_id)}</p></div><a target="_blank" href="profile.html?id=${encodeURIComponent(p.legacy_id)}">Открыть у клиента</a></div>
<div class="admin-media-row"><div><img class="admin-avatar-preview" id="adminAvatarPreview" src="${E(p.avatar_url||'icon-192.png')}"><label class="admin-file-btn">Изменить аватар<input id="adminAvatarFile" type="file" accept="image/*" hidden></label></div><div class="admin-cover-wrap"><img id="adminCoverPreview" src="${E(p.cover_url||p.avatar_url||'icon-512.png')}"><label class="admin-file-btn">Изменить обложку<input id="adminCoverFile" type="file" accept="image/*" hidden></label></div></div>
<div class="admin-form-grid"><label>Имя профиля<input id="fName" value="${E(p.profile_name||'')}"></label><label>Специализация<input id="fSpec" value="${E(p.specialization||'')}"></label><label>Город<input id="fCity" value="${E(p.city||'Бишкек')}"></label><label>Район<input id="fArea" value="${E(p.area||'')}"></label><label class="span2">Адрес<input id="fAddress" value="${E(p.address||'')}"></label><label>Широта<input id="fLat" type="number" step="any" value="${p.latitude??''}"></label><label>Долгота<input id="fLng" type="number" step="any" value="${p.longitude??''}"></label><label>Опыт<input id="fExperience" value="${E(p.experience_text||'')}"></label><label>Оплата<input id="fPayment" value="${E(p.payment||'')}"></label><label class="span2">О мастере<textarea id="fBio">${E(p.bio||'')}</textarea></label><label class="span2">Как найти / ориентир<textarea id="fLocation">${E(p.location_info||'')}</textarea></label></div>
<div class="admin-category-checks">${categories.map(([id,l])=>`<label><input type="checkbox" data-cat="${id}" ${cats.includes(id)?'checked':''}> ${l}</label>`).join('')}</div>
<div class="admin-status-box"><label><input id="fPublished" type="checkbox" ${p.is_published?'checked':''}> Профиль опубликован</label><label class="danger"><input id="fBlocked" type="checkbox" ${p.is_blocked?'checked':''}> Заблокировать профиль</label><label>Причина блокировки<input id="fBlockReason" value="${E(p.blocked_reason||'')}" placeholder="Необязательно"></label></div>
<button class="admin-primary" id="saveProfile">Сохранить профиль</button><div id="profileMsg" class="admin-inline-msg"></div></section>`}
function serviceView(){return`<section class="admin-panel"><div class="admin-panel-head"><div><h2>Услуги</h2><p>${bundle.services.length} услуг</p></div><button id="addService" class="admin-small-btn">+ Добавить</button></div><div id="serviceList" class="admin-service-list">${bundle.services.map(s=>`<article class="admin-service-card" data-service="${s.id}"><div class="admin-service-media"><img src="${E(s.image_url||'icon-192.png')}" alt=""><label class="admin-file-mini">Фото<input class="sImage" type="file" accept="image/*" hidden></label></div><div class="admin-service-fields"><label>Название<input class="sName" value="${E(s.name)}"></label><div class="admin-form-grid"><label>Цена<input class="sPrice" type="number" min="0" value="${money(s.price)}"></label><label>Цена по акции<input class="sNewPrice" type="number" min="0" value="${money(s.new_price)}"></label><label>Длительность<input class="sDuration" value="${E(s.duration_text||'')}"></label><label>Акция<input class="sPromo" value="${E(s.promo_label||'')}"></label></div><label class="admin-toggle"><input class="sActive" type="checkbox" ${s.is_active?'checked':''}> Активна</label><button class="admin-save-service" data-save="${s.id}">Сохранить услугу</button><span class="service-msg"></span></div></article>`).join('')}</div></section>`}
function worksView(){return`<section class="admin-panel"><div class="admin-panel-head"><div><h2>Работы</h2><p>${bundle.works.length} изображений</p></div><label class="admin-small-btn">+ Загрузить<input id="addWorkFile" type="file" accept="image/*" hidden></label></div><div class="admin-work-grid">${bundle.works.length?bundle.works.map(w=>`<figure><img src="${E(w.image_url)}"><button data-del-work="${w.id}">Удалить</button></figure>`).join(''):'<div class="admin-empty">Работ пока нет</div>'}</div><div id="worksMsg" class="admin-inline-msg"></div></section>`}
function scheduleView(){
 const cfg=bundle.profile.schedule_config||{},slots=bundle.slots||[];
 const available=slots.filter(x=>x.is_available).length;
 const wdMap={'ПН':1,'ВТ':2,'СР':3,'ЧТ':4,'ПТ':5,'СБ':6,'ВС':0};
 let selected=Array.isArray(cfg.workDays)?cfg.workDays.map(v=>{const n=Number(v);return Number.isInteger(n)&&n>=0&&n<=6?n:wdMap[String(v||'').toUpperCase()]}).filter(v=>v!==undefined):[];
 if(!selected.length){
  if(cfg.days==='Будни')selected=[1,2,3,4,5];
  else if(cfg.days==='Выходные')selected=[0,6];
  else if(cfg.days==='Пн–Сб')selected=[1,2,3,4,5,6];
  else selected=[0,1,2,3,4,5,6];
 }
 return`<section class="admin-panel"><div class="admin-panel-head"><div><h2>Расписание</h2><p>Сейчас в базе: ${available} свободных из ${slots.length} будущих слотов</p></div></div><div class="admin-form-grid"><label>Начало<input id="schStart" type="time" value="${E(cfg.start||'10:00')}"></label><label>Конец<input id="schEnd" type="time" value="${E(cfg.end||'19:00')}"></label><label>Шаг, минут<select id="schStep"><option value="30" ${Number(cfg.step||60)===30?'selected':''}>30</option><option value="60" ${Number(cfg.step||60)===60?'selected':''}>60</option><option value="90" ${Number(cfg.step||60)===90?'selected':''}>90</option><option value="120" ${Number(cfg.step||60)===120?'selected':''}>120</option></select></label><label>Дней вперёд<input id="schDays" type="number" min="1" max="62" value="30"></label></div><div class="admin-weekdays">${[['1','Пн'],['2','Вт'],['3','Ср'],['4','Чт'],['5','Пт'],['6','Сб'],['0','Вс']].map(([v,l])=>`<label><input type="checkbox" data-weekday="${v}" ${selected.includes(Number(v))?'checked':''}> ${l}</label>`).join('')}</div><p class="admin-warning">Сохранение обновляет будущую сетку. Уже занятые времена база автоматически оставит недоступными.</p><button class="admin-primary" id="saveSchedule">Сохранить свободные окна</button><div id="scheduleMsg" class="admin-inline-msg"></div><div class="admin-slot-preview">${slotPreview(slots)}</div></section>`}

function slotPreview(slots){
 const map={};
 (slots||[]).filter(x=>x.is_available).forEach(x=>{
  const d=new Date(x.starts_at);if(Number.isNaN(d.getTime()))return;
  const day=d.toLocaleDateString('ru-RU'),time=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  (map[day]||(map[day]=[])).push(time);
 });
 return Object.entries(map).slice(0,10).map(([day,times])=>`<div><b>${E(day)}</b><span>${E(times.slice(0,8).join(', '))}${times.length>8?'…':''}</span></div>`).join('')||'<div class="admin-empty">Свободных окон нет</div>';
}

function auditView(){return`<section class="admin-panel"><h2>История действий администратора</h2><div class="admin-audit-list">${bundle.audit.length?bundle.audit.map(a=>`<article><b>${E(a.admin_name||'Admin')}</b><span>${E(a.action)} · ${E(a.entity_type)}</span><small>${new Date(a.created_at).toLocaleString('ru-RU')}</small></article>`).join(''):'<div class="admin-empty">История пока пустая</div>'}</div></section>`}
function render(){if(!bundle)return;host.innerHTML=currentTab==='profile'?profileView():currentTab==='services'?serviceView():currentTab==='works'?worksView():currentTab==='schedule'?scheduleView():auditView();bind()}
function msg(id,text,ok=true){const el=document.getElementById(id);if(el){el.textContent=text;el.className='admin-inline-msg '+(ok?'ok':'error')}}
function bind(){
 if(currentTab==='profile'){
  ['adminAvatarFile','adminCoverFile'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{const f=e.target.files?.[0];if(f)document.getElementById(id==='adminAvatarFile'?'adminAvatarPreview':'adminCoverPreview').src=URL.createObjectURL(f)}));
  document.getElementById('saveProfile').onclick=async()=>{const b=document.getElementById('saveProfile'),p=bundle.profile,before={...p};b.disabled=true;b.textContent='Сохраняем…';try{let avatar=p.avatar_url,cover=p.cover_url;const af=document.getElementById('adminAvatarFile').files?.[0],cf=document.getElementById('adminCoverFile').files?.[0];if(af)avatar=await PNAdmin.uploadMaster(p.user_id,af,'avatar');if(cf)cover=await PNAdmin.uploadMaster(p.user_id,cf,'cover');const cats=[...document.querySelectorAll('[data-cat]:checked')].map(x=>x.dataset.cat);const patch={profile_name:document.getElementById('fName').value.trim()||null,specialization:document.getElementById('fSpec').value.trim()||null,city:document.getElementById('fCity').value.trim()||'Бишкек',area:document.getElementById('fArea').value.trim()||null,address:document.getElementById('fAddress').value.trim()||null,latitude:document.getElementById('fLat').value===''?null:Number(document.getElementById('fLat').value),longitude:document.getElementById('fLng').value===''?null:Number(document.getElementById('fLng').value),experience_text:document.getElementById('fExperience').value.trim()||null,payment:document.getElementById('fPayment').value.trim()||null,bio:document.getElementById('fBio').value.trim()||null,location_info:document.getElementById('fLocation').value.trim()||null,categories:cats,avatar_url:avatar||null,cover_url:cover||null,is_published:document.getElementById('fPublished').checked,is_blocked:document.getElementById('fBlocked').checked,blocked_reason:document.getElementById('fBlockReason').value.trim()||null};bundle.profile=await PNAdmin.saveProfile(p.user_id,patch,before);msg('profileMsg','Сохранено');document.getElementById('editorTitle').textContent=bundle.profile.profile_name||'Мастер'}catch(e){msg('profileMsg',e.message,false)}finally{b.disabled=false;b.textContent='Сохранить профиль'}};
 }
 if(currentTab==='services'){
  document.getElementById('addService').onclick=async()=>{try{await PNAdmin.addService(bundle.profile.user_id);await reload('services')}catch(e){alert(e.message)}};
  document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('[data-service]'),id=btn.dataset.save,s=bundle.services.find(x=>x.id===id),before={...s};btn.disabled=true;btn.textContent='Сохраняем…';try{let image=s.image_url;const f=card.querySelector('.sImage').files?.[0];if(f)image=await PNAdmin.uploadService(bundle.profile.user_id,f);const patch={name:card.querySelector('.sName').value.trim()||'Услуга',price:Number(card.querySelector('.sPrice').value)||0,new_price:card.querySelector('.sNewPrice').value===''?null:Number(card.querySelector('.sNewPrice').value),duration_text:card.querySelector('.sDuration').value.trim()||null,duration_minutes:window.PNDurationMinutes?.(card.querySelector('.sDuration').value,60)||60,promo_label:card.querySelector('.sPromo').value.trim()||null,image_url:image||null,is_active:card.querySelector('.sActive').checked};await PNAdmin.saveService(bundle.profile.user_id,id,patch,before);card.querySelector('.service-msg').textContent='Сохранено'}catch(e){card.querySelector('.service-msg').textContent=e.message}finally{btn.disabled=false;btn.textContent='Сохранить услугу'}});
 }
 if(currentTab==='works'){
  document.getElementById('addWorkFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;msg('worksMsg','Загружаем…');try{await PNAdmin.addWork(bundle.profile.user_id,f);await reload('works')}catch(err){msg('worksMsg',err.message,false)}};
  document.querySelectorAll('[data-del-work]').forEach(btn=>btn.onclick=async()=>{const w=bundle.works.find(x=>x.id===btn.dataset.delWork);if(!w||!confirm('Удалить эту работу?'))return;try{await PNAdmin.deleteWork(bundle.profile.user_id,w);await reload('works')}catch(e){alert(e.message)}})
 }
 if(currentTab==='schedule')document.getElementById('saveSchedule').onclick=async()=>{const b=document.getElementById('saveSchedule');b.disabled=true;b.textContent='Сохраняем…';try{const weekdays=[...document.querySelectorAll('[data-weekday]:checked')].map(x=>Number(x.dataset.weekday));const inserted=await PNAdmin.replaceSchedule(bundle.profile.user_id,{start:document.getElementById('schStart').value,end:document.getElementById('schEnd').value,step:Number(document.getElementById('schStep').value),daysAhead:Number(document.getElementById('schDays').value),weekdays});msg('scheduleMsg',`Готово: ${inserted.filter(x=>x.is_available).length} свободных окон`);await reload('schedule')}catch(e){msg('scheduleMsg',e.message,false)}finally{b.disabled=false;b.textContent='Сохранить свободные окна'}};
}
async function reload(tabName=currentTab){bundle=await PNAdmin.loadMaster(legacyId);currentTab=tabName;document.getElementById('editorTitle').textContent=bundle.profile.profile_name||bundle.contact?.name||'Мастер';document.getElementById('editorMeta').textContent=`ID ${bundle.profile.legacy_id} · ${bundle.contact?.phone||'телефон не указан'}${bundle.profile.is_blocked?' · ЗАБЛОКИРОВАН':''}`;render()}
(async()=>{if(!Number.isFinite(legacyId)){host.innerHTML='<div class="admin-error-box">Не указан ID мастера</div>';return}try{await PNAdmin.requireAdmin();await reload()}catch(e){host.innerHTML='<div class="admin-error-box">'+E(e.message)+'</div>'}})();
</script></body></html>

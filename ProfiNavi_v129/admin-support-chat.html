<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Диалог поддержки — ProfiNavi Admin</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="chat-page admin-support-chat-page"><main class="chat-screen"><header class="chat-screen-head"><button class="chat-back" onclick="location.href='admin-support.html'">‹</button><div class="admin-support-avatar" id="adminChatAvatar">?</div><div><h1 id="adminChatName">Поддержка</h1><p id="adminChatMeta">Загружаем…</p></div></header><section class="chat-screen-body" id="adminSupportMessages"></section><form class="chat-screen-form" id="adminSupportForm"><input id="adminSupportInput" maxlength="5000" placeholder="Ответить пользователю…" autocomplete="off"><button aria-label="Отправить">➤</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const q=new URLSearchParams(location.search),threadId=q.get('id'),box=document.getElementById('adminSupportMessages'),form=document.getElementById('adminSupportForm'),input=document.getElementById('adminSupportInput');let state=null,channel=null;
const esc=PNAdmin.esc,time=v=>new Date(v).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
async function load(){if(!threadId){location.replace('admin-support.html');return}try{state=await PNAdmin.loadSupportThread(threadId);const c=state.contact||{},name=c.name||'Пользователь ProfiNavi';document.getElementById('adminChatName').textContent=name;document.getElementById('adminChatMeta').textContent=(c.role==='master'?'Мастер':'Клиент')+(c.phone?' · '+c.phone:'');document.getElementById('adminChatAvatar').textContent=name.charAt(0).toUpperCase();const msgs=state.messages||[];box.innerHTML=msgs.length?'<div class="chat-date">Техническая поддержка</div>'+msgs.map(m=>`<div class="chat-row ${m.sender_id===state.admin.id?'user':'master'}"><div class="chat-bubble">${esc(m.body).replace(/\n/g,'<br>')}<div class="chat-time">${time(m.created_at)}</div></div></div>`).join(''):'<div class="chat-empty-state"><h2>Сообщений пока нет</h2></div>';await PNAdmin.markSupportRead(threadId);requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);watch()}catch(e){box.innerHTML='<div class="chat-empty-state"><h2>Ошибка</h2><p>'+esc(e.message)+'</p></div>'}}
function watch(){if(channel||!window.pnSupabase)return;channel=pnSupabase.channel(`pn-admin-support-${threadId}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:`thread_id=eq.${threadId}`},()=>load()).subscribe()}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const b=form.querySelector('button');b.disabled=true;input.disabled=true;try{await PNAdmin.sendSupportMessage(threadId,text);input.value='';await load()}catch(err){alert('Не удалось отправить ответ: '+err.message)}finally{b.disabled=false;input.disabled=false;input.focus()}};
window.addEventListener('beforeunload',()=>{if(channel&&window.pnSupabase)pnSupabase.removeChannel(channel)});load();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Диалог поддержки — ProfiNavi Admin</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="chat-page admin-support-chat-page"><main class="chat-screen"><header class="chat-screen-head"><button class="chat-back" onclick="location.href='admin-support.html'">‹</button><div class="admin-support-avatar" id="adminChatAvatar">?</div><div><h1 id="adminChatName">Поддержка</h1><p id="adminChatMeta">Загружаем…</p></div></header><section class="chat-screen-body" id="adminSupportMessages"></section><form class="chat-screen-form chat-media-form" id="adminSupportForm"><div class="chat-file-preview" id="adminSupportPreview"><img id="adminSupportPreviewImg" alt="Выбранное фото"><span id="adminSupportPreviewName"></span><button type="button" class="chat-file-remove" id="adminSupportPreviewRemove" aria-label="Убрать фото">×</button></div><div class="chat-compose-row"><input type="file" id="adminSupportFile" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden><button type="button" class="chat-attach-btn" id="adminSupportAttach" aria-label="Добавить фото"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><circle cx="9" cy="10" r="1.5"/><path d="m6.5 16 4-4 3 3 2-2 2 3"/></svg></button><input id="adminSupportInput" maxlength="5000" placeholder="Ответить пользователю…" autocomplete="off"><button type="submit" class="chat-send-btn" aria-label="Отправить">➤</button></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const q=new URLSearchParams(location.search),threadId=q.get('id'),box=document.getElementById('adminSupportMessages'),form=document.getElementById('adminSupportForm'),input=document.getElementById('adminSupportInput'),fileInput=document.getElementById('adminSupportFile'),attach=document.getElementById('adminSupportAttach'),preview=document.getElementById('adminSupportPreview'),previewImg=document.getElementById('adminSupportPreviewImg'),previewName=document.getElementById('adminSupportPreviewName'),remove=document.getElementById('adminSupportPreviewRemove');let state=null,channel=null,selectedFile=null,previewUrl='';
const esc=PNAdmin.esc,time=v=>new Date(v).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
async function load(){if(!threadId){location.replace('admin-support.html');return}try{state=await PNAdmin.loadSupportThread(threadId);const c=state.contact||{},name=c.name||'Пользователь ProfiNavi';document.getElementById('adminChatName').textContent=name;document.getElementById('adminChatMeta').textContent=(c.role==='master'?'Мастер':'Клиент')+(c.phone?' · '+c.phone:'');document.getElementById('adminChatAvatar').textContent=name.charAt(0).toUpperCase();const msgs=state.messages||[];box.innerHTML=msgs.length?'<div class="chat-date">Техническая поддержка</div>'+msgs.map(m=>`<div class="chat-row ${m.sender_id===state.admin.id?'user':'master'}"><div class="chat-bubble">${m.image_url?`<a class="chat-image-link" href="${esc(m.image_url)}" target="_blank" rel="noopener"><img class="chat-message-image" src="${esc(m.image_url)}" alt="Фото в чате"></a>`:''}${m.body?`<div class="chat-message-text">${esc(m.body).replace(/\n/g,'<br>')}</div>`:''}<div class="chat-time">${time(m.created_at)}</div></div></div>`).join(''):'<div class="chat-empty-state"><h2>Сообщений пока нет</h2></div>';await PNAdmin.markSupportRead(threadId);requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);watch()}catch(e){box.innerHTML='<div class="chat-empty-state"><h2>Ошибка</h2><p>'+esc(e.message)+'</p></div>'}}
function watch(){if(channel||!window.pnSupabase)return;channel=pnSupabase.channel(`pn-admin-support-${threadId}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:`thread_id=eq.${threadId}`},()=>load()).subscribe()}
const clearSelected=()=>{selectedFile=null;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';fileInput.value='';preview.classList.remove('show');previewImg.removeAttribute('src');previewName.textContent=''};
attach.onclick=()=>fileInput.click();fileInput.onchange=()=>{const f=fileInput.files?.[0]||null;if(!f){clearSelected();return}try{pnValidateImageFile(f)}catch(err){alert(err.message);clearSelected();return}selectedFile=f;previewUrl=URL.createObjectURL(f);previewImg.src=previewUrl;previewName.textContent=f.name||'Фото';preview.classList.add('show')};remove.onclick=clearSelected;
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text&&!selectedFile)return;const b=form.querySelector('.chat-send-btn');b.disabled=true;attach.disabled=true;input.disabled=true;try{await PNAdmin.sendSupportMessage(threadId,text,selectedFile);input.value='';clearSelected();await load()}catch(err){alert('Не удалось отправить ответ: '+err.message)}finally{b.disabled=false;attach.disabled=false;input.disabled=false;input.focus()}};
window.addEventListener('beforeunload',()=>{if(channel&&window.pnSupabase)pnSupabase.removeChannel(channel)});load();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProfiNavi Admin — поддержка</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"><style>
.admin-support-tabs{display:flex;gap:8px;margin:0 0 14px;overflow:auto;scrollbar-width:none}.admin-support-tabs button{border:1px solid var(--line);background:#fff;color:#776871;border-radius:999px;padding:10px 15px;font-weight:900;white-space:nowrap}.admin-support-tabs button.active{background:var(--pink);border-color:var(--pink);color:#fff}
</style></head>
<body class="admin-page"><main class="admin-shell"><header class="admin-top"><div><small>PROFINAVI ADMIN</small><h1>Техническая поддержка</h1><p id="adminIdentity">Проверяем доступ…</p></div><div class="admin-top-actions"><a class="admin-support-nav light" href="admin.html">Главная</a><button id="adminLogout" class="admin-logout-btn">Выйти</button></div></header>
<section class="admin-toolbar"><input id="supportSearch" placeholder="Поиск по имени или телефону"><button id="supportReload">Поиск</button></section><nav class="admin-support-tabs" aria-label="Тип контакта"><button class="active" data-support-view="masters">Мастера</button><button data-support-view="clients">Клиенты</button></nav><div id="supportStats" class="admin-stats"></div><section id="supportThreads" class="admin-support-list"><div class="admin-loading">Загружаем обращения…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>const host=document.getElementById('supportThreads'),search=document.getElementById('supportSearch');let all=[],supportChannel=null,currentView='masters';
const roleLabel=r=>r==='master'?'Мастер':'Клиент';
const kindOf=x=>x.supportRole==='master'?'master':'client';
function card(x){const name=PNAdmin.esc(x.contact?.name||'Пользователь ProfiNavi'),phone=PNAdmin.esc(x.contact?.phone||'Телефон не указан'),last=PNAdmin.esc(x.lastMessage?.body||(x.lastMessage?.image_path?'Фото':'Диалог создан')),tm=x.lastMessage?new Date(x.lastMessage.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'',role=kindOf(x);return `<a class="admin-support-card ${x.unreadCount?'is-unread':''}" href="admin-support-chat.html?id=${encodeURIComponent(x.id)}"><div class="admin-support-avatar">${name.charAt(0).toUpperCase()}</div><div><div class="admin-support-title"><h2>${name}</h2><span>${roleLabel(role)}</span></div><p>${last}</p><small>${phone}${tm?' · '+tm:''}</small></div>${x.unreadCount?`<b class="admin-support-unread">${x.unreadCount}</b>`:'<em>›</em>'}</a>`}
function setView(view){currentView=view==='clients'?'clients':'masters';document.querySelectorAll('[data-support-view]').forEach(b=>b.classList.toggle('active',b.dataset.supportView===currentView));render()}
function render(){const q=search.value.trim().toLowerCase(),role=currentView==='clients'?'client':'master',rows=all.filter(x=>kindOf(x)===role).filter(x=>!q||[x.contact?.name,x.contact?.phone,roleLabel(kindOf(x))].some(v=>String(v||'').toLowerCase().includes(q)));host.innerHTML=rows.length?rows.map(card).join(''):`<div class="admin-empty">${role==='master'?'Обращений от мастеров пока нет':'Обращений от клиентов пока нет'}</div>`;document.getElementById('supportStats').innerHTML=`<div><b>${all.length}</b><span>Диалогов</span></div><div><b>${all.filter(x=>kindOf(x)==='master').length}</b><span>Мастера</span></div><div><b>${all.filter(x=>kindOf(x)==='client').length}</b><span>Клиенты</span></div><div><b>${all.reduce((n,x)=>n+Number(x.unreadCount||0),0)}</b><span>Новых сообщений</span></div>`}
async function classifyThreads(rows){const ids=[...new Set(rows.map(x=>x.user_id).filter(Boolean))];if(!ids.length)return rows.map(x=>({...x,supportRole:x.contact?.role==='master'?'master':'client'}));const r=await pnSupabase.from('master_profiles').select('user_id').in('user_id',ids);if(r.error)throw r.error;const masterIds=new Set((r.data||[]).map(x=>x.user_id));return rows.map(x=>({...x,supportRole:masterIds.has(x.user_id)||x.contact?.role==='master'?'master':'client'}))}
async function load(){host.innerHTML='<div class="admin-loading">Загружаем обращения…</div>';try{const u=await PNAdmin.requireAdmin();document.getElementById('adminIdentity').textContent=(u.app_metadata?.admin_name||'Admin')+' · '+(u.phone||u.user_metadata?.phone||'');all=await classifyThreads(await PNAdmin.listSupportThreads());render()}catch(e){host.innerHTML='<div class="admin-error-box">'+PNAdmin.esc(e.message)+'</div>'}}
function watch(){if(supportChannel||!window.pnSupabase)return;supportChannel=pnSupabase.channel('pn-admin-support-inbox').on('postgres_changes',{event:'*',schema:'public',table:'support_threads'},()=>load()).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages'},()=>load()).subscribe()}
search.oninput=render;document.getElementById('supportReload').onclick=load;document.querySelectorAll('[data-support-view]').forEach(b=>b.onclick=()=>setView(b.dataset.supportView));document.getElementById('adminLogout').onclick=()=>PNAdmin.logout();window.addEventListener('pageshow',load);window.addEventListener('beforeunload',()=>{if(supportChannel&&window.pnSupabase)pnSupabase.removeChannel(supportChannel)});load().then(watch);setTimeout(watch,300);</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProfiNavi Admin — поддержка</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="admin-page"><main class="admin-shell"><header class="admin-top"><div><small>PROFINAVI ADMIN</small><h1>Техническая поддержка</h1><p id="adminIdentity">Проверяем доступ…</p></div><div class="admin-top-actions"><a class="admin-support-nav light" href="admin.html">Мастера</a><button id="adminLogout" class="admin-logout-btn">Выйти</button></div></header>
<section class="admin-toolbar"><input id="supportSearch" placeholder="Поиск по имени или телефону"><button id="supportReload">Обновить</button></section><div id="supportStats" class="admin-stats"></div><section id="supportThreads" class="admin-support-list"><div class="admin-loading">Загружаем обращения…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const host=document.getElementById('supportThreads'),search=document.getElementById('supportSearch');let all=[],supportChannel=null;
const roleLabel=r=>r==='master'?'Мастер':'Клиент';
function render(){const q=search.value.trim().toLowerCase(),rows=all.filter(x=>!q||[x.contact?.name,x.contact?.phone,x.contact?.role].some(v=>String(v||'').toLowerCase().includes(q)));host.innerHTML=rows.length?rows.map(x=>{const name=PNAdmin.esc(x.contact?.name||'Пользователь ProfiNavi'),phone=PNAdmin.esc(x.contact?.phone||'Телефон не указан'),last=PNAdmin.esc(x.lastMessage?.body||'Диалог создан'),tm=x.lastMessage?new Date(x.lastMessage.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';return `<a class="admin-support-card ${x.unreadCount?'is-unread':''}" href="admin-support-chat.html?id=${encodeURIComponent(x.id)}"><div class="admin-support-avatar">${name.charAt(0).toUpperCase()}</div><div><div class="admin-support-title"><h2>${name}</h2><span>${roleLabel(x.contact?.role)}</span></div><p>${last}</p><small>${phone}${tm?' · '+tm:''}</small></div>${x.unreadCount?`<b class="admin-support-unread">${x.unreadCount}</b>`:'<em>›</em>'}</a>`}).join(''):'<div class="admin-empty">Обращений пока нет</div>';document.getElementById('supportStats').innerHTML=`<div><b>${all.length}</b><span>Диалогов</span></div><div><b>${all.filter(x=>x.unreadCount).length}</b><span>Непрочитано</span></div><div><b>${all.reduce((n,x)=>n+Number(x.unreadCount||0),0)}</b><span>Новых сообщений</span></div>`}
async function load(){host.innerHTML='<div class="admin-loading">Загружаем обращения…</div>';try{const u=await PNAdmin.requireAdmin();document.getElementById('adminIdentity').textContent=(u.app_metadata?.admin_name||'Admin')+' · '+(u.phone||u.user_metadata?.phone||'');all=await PNAdmin.listSupportThreads();render()}catch(e){host.innerHTML='<div class="admin-error-box">'+PNAdmin.esc(e.message)+'</div>'}}
function watch(){if(supportChannel||!window.pnSupabase)return;supportChannel=pnSupabase.channel('pn-admin-support-inbox').on('postgres_changes',{event:'*',schema:'public',table:'support_threads'},()=>load()).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages'},()=>load()).subscribe()}
search.oninput=render;document.getElementById('supportReload').onclick=load;document.getElementById('adminLogout').onclick=()=>PNAdmin.logout();window.addEventListener('pageshow',load);window.addEventListener('beforeunload',()=>{if(supportChannel&&window.pnSupabase)pnSupabase.removeChannel(supportChannel)});load().then(watch);setTimeout(watch,300);
</script></body></html>

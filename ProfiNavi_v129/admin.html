<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ProfiNavi Admin — мастера</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ff4fa3"></head>
<body class="admin-page"><main class="admin-shell"><header class="admin-top"><div><small>PROFINAVI ADMIN</small><h1>Мастера</h1><p id="adminIdentity">Проверяем доступ…</p></div><button id="adminLogout" class="admin-logout-btn">Выйти</button></header>
<section class="admin-toolbar"><input id="adminSearch" placeholder="Поиск по имени, телефону или ID"><button id="adminReload">Обновить</button></section>
<div id="adminStats" class="admin-stats"></div><section id="adminMasters" class="admin-master-list"><div class="admin-loading">Загружаем мастеров…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="supabase-client.js"></script><script src="pn-admin.js"></script><script>
const host=document.getElementById('adminMasters'),search=document.getElementById('adminSearch');let all=[];
function status(m){if(m.is_blocked)return'<span class="admin-badge blocked">Заблокирован</span>';if(m.is_published)return'<span class="admin-badge live">Опубликован</span>';return'<span class="admin-badge draft">Черновик</span>'}
function render(){const q=search.value.trim().toLowerCase(),rows=all.filter(m=>!q||[m.profile_name,m.contact?.name,m.contact?.phone,m.legacy_id,m.user_id].some(v=>String(v||'').toLowerCase().includes(q)));host.innerHTML=rows.length?rows.map(m=>`<article class="admin-master-card"><img src="${PNAdmin.esc(m.avatar_url||'icon-192.png')}" alt=""><div class="admin-master-copy"><div class="admin-master-title"><h2>${PNAdmin.esc(m.profile_name||m.contact?.name||'Без имени')}</h2>${status(m)}</div><p>${PNAdmin.esc(m.contact?.phone||'Телефон не указан')} · ID ${PNAdmin.esc(m.legacy_id??'—')}</p><small>Рейтинг: ${Number(m.rating||0).toFixed(2)} · отзывов ${Number(m.reviews_count||0)}</small></div><div class="admin-card-actions"><a href="admin-master.html?id=${encodeURIComponent(m.legacy_id)}">Редактировать</a><a class="light" target="_blank" href="profile.html?id=${encodeURIComponent(m.legacy_id)}">Профиль</a></div></article>`).join(''):'<div class="admin-empty">Ничего не найдено</div>';
 document.getElementById('adminStats').innerHTML=`<div><b>${all.length}</b><span>Всего мастеров</span></div><div><b>${all.filter(x=>x.is_published&&!x.is_blocked).length}</b><span>Опубликовано</span></div><div><b>${all.filter(x=>x.is_blocked).length}</b><span>Заблокировано</span></div>`}
async function load(){host.innerHTML='<div class="admin-loading">Загружаем мастеров…</div>';try{const u=await PNAdmin.requireAdmin();document.getElementById('adminIdentity').textContent=(u.app_metadata?.admin_name||'Admin')+' · '+(u.phone||u.user_metadata?.phone||'');all=await PNAdmin.listMasters();render()}catch(e){host.innerHTML='<div class="admin-error-box">'+PNAdmin.esc(e.message)+'</div>'}}
search.oninput=render;document.getElementById('adminReload').onclick=load;document.getElementById('adminLogout').onclick=()=>PNAdmin.logout();load();
</script></body></html>
